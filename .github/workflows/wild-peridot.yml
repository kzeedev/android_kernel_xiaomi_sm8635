name: WildKernels Pipeline for Peridot (Lineage-24.0)

on:
  workflow_dispatch:
    inputs:
      bypass_module_check:
        description: 'Apply WildKernels Module Load Bypass (Fixes Custom ROM Bootloop)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libelf-dev \
            libncurses5-dev libssl-dev libxml2-utils lz4 pahole \
            python3 python-is-python3 rsync unzip wget zip zstd cpio jq

      - name: Clone Peridot Kernel & WildKernels Ecosystem
        run: |
          # 1. Peridot Lineage 24.0 Kernel Source
          git clone --depth=1 -b lineage-24.0 https://github.com/peridot-dev/android_kernel_xiaomi_sm8635.git kernel

          # 2. WildKernels Patch Repository & AnyKernel3
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wild_patches
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git AnyKernel3

          # 3. SUSFS & Droidspaces Official Upstream Repos used by WildKernels
          git clone --depth=1 -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git droidspaces

          # 4. AOSP Clang 18 + mkbootimg
          mkdir -p clang
          wget -qO- https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz | tar -xzf - -C clang
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg.git mkbootimg

      - name: Auto-Apply WildKernels Stack (KSU-Next + SUSFS + Droidspaces + Bypass)
        working-directory: ${{ github.workspace }}/kernel
        run: |
          # 1. Pull WildKernels' pre-integrated KernelSU-Next (pershoot/dev-susfs branch)
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

          # 2. Copy SUSFS kernel files & apply 6.1 patch
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --forward --fuzz=3 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch || true

          # 3. Apply WildKernels Common & Hide Patches automatically
          for p in ../wild_patches/common/*.patch ../wild_patches/maps/*.patch; do
            if [ -f "$p" ]; then
              echo "Applying WildKernels patch: $p"
              patch -p1 --forward --fuzz=3 < "$p" || true
            fi
          done

          # 4. Apply WildKernels Force Module Load Bypass (Critical for Infinity-X vendor_dlkm)
          if [ "${{ inputs.bypass_module_check }}" = "true" ]; then
            # Bypass vermagic and CRC checks in kernel/module/main.c (WildKernels Bypass method)
            sed -i 's/!check_modstruct_version(info, mod)/false/g' kernel/module/main.c || true
            sed -i 's/!check_version(info, modname, mod, crc)/false/g' kernel/module/main.c || true
            sed -i 's/check_modinfo(mod, info, 0)/0/g' kernel/module/main.c || true
          fi

      - name: Merge Configs via WildKernels & Droidspaces Fragments
        working-directory: ${{ github.workspace }}/kernel
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"

          # Collect Droidspaces config fragment if present in repo, otherwise generate from WildKernels preset
          DS_FRAGMENT=$(find ../droidspaces ../wild_patches -name "*droidspaces*.config" -o -name "*container*.config" | head -n 1)
          
          cat << 'EOF' > wild_features.config
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          # CONFIG_MODVERSIONS is not set
          EOF

          # Merge Peridot hardware configs + WildKernels features
          ARCH=arm64 LLVM=1 LLVM_IAS=1 scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/pineapple_GKI.config \
            arch/arm64/configs/vendor/peridot_GKI.config \
            wild_features.config \
            $DS_FRAGMENT

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel
        working-directory: ${{ github.workspace }}/kernel
        run: |
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz Image

      - name: Package Outputs (boot.img + WildKernels AnyKernel3)
        working-directory: ${{ github.workspace }}
        run: |
          # 1. Create boot.img
          python3 mkbootimg/mkbootimg.py \
            --header_version 4 \
            --kernel kernel/out/arch/arm64/boot/Image.gz \
            --cmdline "" \
            --os_version 15.0.0 \
            --os_patch_level 2026-11 \
            -o boot.img

          # 2. Package with WildKernels AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r9 ../Wild-Peridot-Lineage24-AK3.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wild-Peridot-Kernel
          path: |
            boot.img
            Wild-Peridot-Lineage24-AK3.zip
