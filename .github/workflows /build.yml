name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device codename (peridot)
        required: false
        default: peridot
      msm_arch:
        description: MSM variant (palawan)
        required: false
        default: palawan
      use_droidspaces:
        description: Enable DroidSpaces container runtime kernel config
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves cpio python3

      - name: Download clang toolchain
        run: |
          mkdir -p clang
          curl -L --fail \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2023/clang-r487747c.tar.gz" \
            | tar -xz -C clang

      - name: Build kernel
        run: |
          bash .github/scripts/build-kernel.sh \
            "$PWD" \
            "$PWD/clang" \
            "${{ inputs.device || 'peridot' }}" \
            "${{ inputs.msm_arch || 'palawan' }}"

      - name: Package artifacts
        run: bash .github/scripts/package.sh "$PWD"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device || 'peridot' }}
          if-no-files-found: ignore
          path: |
            dist/Image
            dist/config
